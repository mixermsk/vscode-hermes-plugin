<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; script-src {{cspSource}};">
<link rel="stylesheet" href="{{stylesheetUri}}">
</head>
<body>
  <main class="chat-layout">
    <div id="session" class="session">No session connected.</div>
    <div id="messages" class="messages" role="log" aria-live="polite"></div>
    <form id="form" class="composer">
      <textarea id="prompt" rows="4" placeholder="Ask Hermes…" aria-label="Message to Hermes"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <script src="{{scriptUri}}"></script>
</body>
</html>
