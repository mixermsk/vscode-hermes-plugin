<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; script-src {{cspSource}};">
<link rel="stylesheet" href="{{stylesheetUri}}">
</head>
<body>
  <main class="chat-layout">
    <div id="session" class="session">Connecting to Hermes…</div>
    <div id="subagent-tracking" class="subagent-tracking" role="status" hidden></div>
    <div id="messages" class="messages" role="log" aria-live="polite">
      <div id="activity" class="activity" role="status" hidden></div>
    </div>
    <form id="form" class="composer">
      <div class="composer-controls">
        <label class="auto-approve-edits" for="auto-approve-edits">
          <input id="auto-approve-edits" type="checkbox" disabled>
          Approve edits
        </label>
        <div class="selectors">
          <label class="model-picker">
            <span class="model-picker-label">Model</span>
            <select id="model" class="model-select" aria-label="Model" disabled></select>
          </label>
          <label class="reasoning-picker">
            <span class="reasoning-picker-label">Reasoning</span>
            <select id="reasoning" class="reasoning-select" aria-label="Reasoning" disabled></select>
          </label>
        </div>
      </div>
      <textarea id="prompt" rows="4" placeholder="Ask Hermes…" aria-label="Message to Hermes" disabled></textarea>
      <button id="send" type="submit" disabled>Send</button>
    </form>
  </main>
  <script src="{{markedUri}}"></script>
  <script src="{{domPurifyUri}}"></script>
  <script src="{{scriptUri}}"></script>
</body>
</html>
